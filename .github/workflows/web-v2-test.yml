name: Web V2 - Test

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-v2/**'
      - '.github/workflows/web-v2-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-v2/**'
      - '.github/workflows/web-v2-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-v2

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/web-v2/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm i

      - name: Validate
        env:
          TZ: Pacific/Kiritimati
        run: pnpm run lint && pnpm test:ci && pnpm run build
