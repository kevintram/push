name: API - Validate

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/api-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/api-validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Keep in sync with the ruff version in apps/api/uv.lock — the action
      # defaults to the latest release, which silently changes the rule set.
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./apps/api"
          version: "0.15.5"

      - uses: astral-sh/ruff-action@v3
        with:
          src: "./apps/api"
          version: "0.15.5"
          args: "format --check --diff"

  Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: |
          uv run pytest tests \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=markdown:coverage.md

      - name: Add coverage to job summary
        run: cat coverage.md >> $GITHUB_STEP_SUMMARY
